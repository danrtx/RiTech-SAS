name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS) - lint, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ritech
          POSTGRES_PASSWORD: ritech_test
          POSTGRES_DB: ritech_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ritech -d ritech_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        # --coverage y --json generan la evidencia que consume el job definition-of-done.
        run: npm test -- --ci --runInBand --coverage --json --outputFile=coverage/jest-results.json
        env:
          RUN_CHART_DB_TESTS: '1'
          RUN_INVESTMENT_DB_TESTS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: ritech
          DB_PASSWORD: ritech_test
          DB_NAME: ritech_test

      - name: Auditoria de seguridad (informe, no certificacion)
        run: npm run audit:security -- --output=${{ runner.temp }}/security-audit.json

      - name: Verificar conexiones TLS locales
        run: npm run qa:tls:local -- --output=${{ runner.temp }}/tls-local.json

      - name: Build
        run: npm run build

      - name: Redis real, carga y reconexion simulada
        run: npm run test:integration
        env:
          REDIS_TEST_HOST: 127.0.0.1
          REDIS_TEST_PORT: '6379'
          REDIS_TEST_PASSWORD: ''
          QA_REPORT_PATH: ${{ runner.temp }}/streaming_metrics.json

      # Falla el job si algún tick supera los 200 ms entre ingesta y hedging.
      - name: NFR-001 latencia ingesta -> hedging con Redis real
        run: npm run qa:latency -- --redis --duration=30000
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''

      - name: QA epica 01 sobre conector Alpaca simulado
        run: npm run qa:epic01 -- --strict-continuity
        env:
          REDIS_TEST_HOST: 127.0.0.1
          REDIS_TEST_PORT: '6379'
          REDIS_TEST_PASSWORD: ''
          QA_EPIC01_REPORT_PATH: ${{ runner.temp }}/epic01_metrics.json

      - name: Evidencia de streaming
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-metrics
          path: |
            ${{ runner.temp }}/streaming_metrics.json
            ${{ runner.temp }}/epic01_metrics.json
            ${{ runner.temp }}/security-audit.json
            ${{ runner.temp }}/tls-local.json
          if-no-files-found: warn

      - name: Evidencia NFR-001
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: reportes/latencia/
          if-no-files-found: warn

      - name: Cobertura backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/lcov.info
            backend/coverage/coverage-summary.json
            backend/coverage/jest-results.json
          if-no-files-found: warn

  mobile:
    name: App movil (Flutter) - analyze y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos

      # El reporte JSON permite al acta DoD contar pruebas aprobadas y fallidas.
      - name: Pruebas unitarias con cobertura
        run: flutter test --coverage --file-reporter=json:coverage/flutter-tests.json

      - name: Cobertura app movil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: |
            frontend_mobile/coverage/lcov.info
            frontend_mobile/coverage/flutter-tests.json
          if-no-files-found: warn

      - name: Compilar dashboard web
        run: flutter build web

  atr-packages:
    name: Paquetes ATR Dart y adaptador Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Core Dart
        working-directory: packages/atr_engine
        run: |
          dart pub get
          dart analyze
          dart test
          dart format --output=none --set-exit-if-changed .
      - name: Adaptador Flutter
        working-directory: packages/atr_engine_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart format --output=none --set-exit-if-changed .

  # Consolida cobertura, pruebas, latencia y auditoría en un borrador del acta DoD.
  # Corre siempre (if: always) para mostrar el estado aunque otro job falle.
  definition-of-done:
    name: Definition of Done (cobertura, pruebas, latencia, Sonar)
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: always()
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: mobile-coverage
          path: frontend_mobile/coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: latency-report
          path: reportes/latencia
        continue-on-error: true

      - name: Borrador del acta DoD
        run: |
          node backend/scripts/dod-report.cjs --output-dir=${{ runner.temp }}/dod
          cat ${{ runner.temp }}/dod/*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: acta-dod
          path: ${{ runner.temp }}/dod/

      # Solo corre si el repositorio tiene configurado el secreto SONAR_TOKEN.
      - name: Analisis SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

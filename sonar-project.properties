# SonarQube / SonarCloud: análisis del monorepo RiTech SAS.
# El token se entrega como secreto SONAR_TOKEN y la URL como SONAR_HOST_URL; nunca se versionan.
sonar.projectKey=ritech-sas
sonar.projectName=RiTech SAS - Hedging NASDAQ 100
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend_mobile/lib
sonar.tests=backend/src,frontend_mobile/test
sonar.test.inclusions=backend/src/**/*.spec.ts,frontend_mobile/test/**/*_test.dart

# Arneses de prueba, mocks y arranque no forman parte del código evaluado por la DoD.
sonar.exclusions=backend/src/**/testing/**,backend/src/**/*.spec.ts,**/*.g.dart
sonar.coverage.exclusions=backend/src/main.ts,backend/src/**/testing/**,backend/src/**/migrations/**

# Cobertura generada por `npm run test:cov` (backend) y `flutter test --coverage` (app).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# Dart requiere el plugin comunitario sonar-flutter en el servidor SonarQube.
sonar.flutter.coverage.reportPath=frontend_mobile/coverage/lcov.info

# DoD: cobertura de código nuevo y global superior al 80 % (configurar en el Quality Gate).
sonar.qualitygate.wait=true

# Infraestructura local de desarrollo para el backend de RiTech (NestJS).
# Levanta PostgreSQL (persistencia) y Redis (caché de ticks / ventana móvil).
# Uso: docker compose up -d   (ver README.md)

name: ritech

services:
  postgres:
    image: postgres:16-alpine
    container_name: ritech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ritech}
      POSTGRES_USER: ${POSTGRES_USER:-ritech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritech_dev}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ritech-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ritech_dev}
    # AOF activado para que la caché sobreviva a reinicios del contenedor en desarrollo.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: ritech_postgres_data
  redis_data:
    name: ritech_redis_data
